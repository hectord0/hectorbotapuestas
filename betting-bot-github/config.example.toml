# Configuración del bot de apuestas.
# Copia este archivo a config.toml y ajusta lo que necesites.
# Los secretos (API key, Telegram) van en .env, no aquí.

[general]
# Deportes: soccer, basketball, tennis, mma, table_tennis
sports = ["soccer", "basketball", "tennis", "mma", "table_tennis"]

# "sample" = datos sintéticos para probar; "oddsapi" = The Odds API real.
provider = "sample"
# Si quieres vigilar solo ciertas ligas, rellena esta lista (ver `run.py leagues`).
leagues = []
# Sube la severidad de alertas en ligas con más riesgo de error.
prioritize_error_prone = true
# Proveedor manual de tarjetas/córners (cuando uses provider = "manual").
manual_odds_file = "data/odds_manual.json"

# Canal de alertas: "auto" (elige según credenciales), "console", "telegram",
# "ntfy", "windows", "discord" o una lista como ["windows", "ntfy"].
notifier = "auto"
# Ventana de eventos a vigilar: "days:1", "days:2" o "days:3" (rango 1-3),
# "next24h", "today", "tomorrow", "hours:N" o "all" (sin filtro).
event_day = "days:1"
# Errores graves (ARB/MISPRICING/DIVERGENCE) hasta 7 días.
error_scan_days = 7
# Solo notificar partidos de 1 a 3 días ('' = usar event_day).
notify_day = "days:1"
# Perfil de seguridad: safe (solo apuestas fiables), balanced o all.
safety_mode = "safe"
min_safe_score = 70
# Solo notificar apuestas recomendadas (decisión APOSTAR).
focus_actionable = true
# Nunca apostar en dos casas: se descartan arbitrajes.
single_book_only = true
min_single_book_score = 45
# Riesgo máximo: BAJO (solo lo más seguro), MEDIO (recomendado) o ALTO.
max_risk_level = "MEDIO"
# ntfy: push gratis sin cuenta. Elige un tema difícil de adivinar.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"
# Discord: URL del webhook del canal.
discord_webhook_url = ""

db_path = "betting.db"

# Segundos entre sondeos en `watch`.
poll_interval = 180

# No repetir la misma alerta antes de estos minutos.
alert_cooldown_min = 120

# Regiones y mercados de The Odds API (eu = casas europeas).
regions = "eu"
markets = "h2h,spreads,totals"

[value]
min_edge = 0.03            # 3% de ventaja mínima
kelly_fraction = 0.25      # 25% de Kelly completo
max_stake_pct = 0.02       # nunca más del 2% de la banca
bankroll = 1000.0
min_price = 1.30           # ignorar cuotas demasiado bajas
max_price = 12.00          # ignorar longshots extremos
max_model_disagreement = 0.20  # descartar si el modelo se aleja del consenso

[movement]
drop_pct = 0.08            # caída que dispara STEAM
rise_pct = 0.10            # subida que dispara DRIFT
window_min = 90
min_points = 2

[errors]
mispricing_edge = 0.05     # 5% por encima del consenso
divergence_spread = 0.12   # 12% entre mejor y peor cuota
method = "shin"            # multiplicative | additive | power | shin
