# Configuración efectiva del bot (creada con los valores recomendados).
# Los secretos van en .env, no aquí.

[general]
# Todos los deportes.
sports = ["soccer", "basketball", "tennis", "mma", "table_tennis"]

# Todas las ligas. La prioridad la calcula el catálogo: las secundarias con
# riesgo de error alto suben de severidad automáticamente.
leagues = []
prioritize_error_prone = true

# "sample" mientras no tengas clave; luego "oddsapi"; para tarjetas/córners "manual".
provider = "sample"
manual_odds_file = "data/odds_manual.json"

db_path = "betting.db"
poll_interval = 300
alert_cooldown_min = 120

# Canal de alertas: auto | console | telegram | ntfy | windows | discord
# (se puede dar una lista: NOTIFIER=windows,ntfy en .env)
notifier = "auto"
# Partidos: days:1 | days:2 | days:3 (rango permitido 1-3 días).
# También acepta next24h, today, tomorrow, hours:12 o all.
event_day = "days:1"
# Errores graves (ARB, MISPRICING, DIVERGENCE) se buscan hasta 7 días.
error_scan_days = 7
# Pero SOLO se notifican partidos de 1 a 3 días.
notify_day = "days:1"
# Perfil de seguridad: safe (solo lo más seguro) | balanced | all
safety_mode = "safe"
min_safe_score = 70
# Prioridad: solo te llegan las apuestas que SÍ deberías hacer.
focus_actionable = true
# Nunca apuestas en dos casas a la vez: se descartan los arbitrajes.
single_book_only = true
min_single_book_score = 45
# Acepta también riesgo MEDIO (stake reducido a la mitad), nunca ALTO.
max_risk_level = "MEDIO"
# Si Telegram te bloquea, usa ntfy: elige un tema y suscríbete en la app.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"
discord_webhook_url = ""

regions = "eu"
markets = "h2h,spreads,totals"

[value]
min_edge = 0.03
kelly_fraction = 0.25
max_stake_pct = 0.02
bankroll = 1000.0
min_price = 1.30
max_price = 12.00
max_model_disagreement = 0.20

[movement]
drop_pct = 0.08
rise_pct = 0.10
window_min = 90
min_points = 2

[errors]
mispricing_edge = 0.05
divergence_spread = 0.12
method = "shin"
